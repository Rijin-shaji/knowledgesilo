name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: knowledgesilo
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: knowledgesilo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=testpass psql -h localhost -U knowledgesilo -d knowledgesilo -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://knowledgesilo:testpass@localhost:5432/knowledgesilo
          MONGO_URL: mongodb://localhost:27017/knowledgesilo
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_for_ci
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest tests/ -v